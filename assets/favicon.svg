    <rect x="14" y="30.5" width="36" height="9" rx="4.5" fill="#E86A5C" transform="rotate(1.4 32 35)"/>
    <rect x="14" y="44"   width="36" height="9" rx="4.5" fill="#6FB3A8" transform="rotate(-1 32 48.5)"/>
  </g>
